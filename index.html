<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dartscorer"><title>Dartscorer</title><style>:root{--bg:#10131a;--p:#191f2a;--p2:#273142;--t:#f4f6fa;--m:#9da8ba;--a:#ffb000;--ok:#5ed18b;--d:#52272b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#273040,#10131a 48%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:18px 16px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:25px;font-weight:900}.muted{color:var(--m);font-size:13px}.panel{background:#191f2af2;border:1px solid #303949;border-radius:20px;padding:16px;box-shadow:0 12px 30px #0005}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:16px}.setup{display:grid;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}label{display:block;color:var(--m);font-size:13px;margin-bottom:6px}input,select{width:100%;background:#111620;color:var(--t);border:1px solid #303949;border-radius:12px;padding:12px}button{border:0;border-radius:13px;padding:13px 15px;background:var(--p2);color:var(--t);font-weight:800;font-size:16px}button:active{transform:scale(.98)}.primary{background:var(--a);color:#17130a}.danger{background:var(--d)}h2,h3{margin:0 0 12px}.scoreline{display:flex;justify-content:space-between;align-items:center}.turn{color:var(--a);font-weight:900}.score{font-size:62px;font-weight:900;line-height:1}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.quick button{font-size:18px}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.keypad button{font-size:20px;padding:16px 8px}.history{max-height:650px;overflow:auto}.round{border-bottom:1px solid #303949;padding:12px 0}.rname{font-weight:800}.darts{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.dart{background:#252e3d;padding:6px 9px;border-radius:9px}.hidden{display:none}.winner{color:var(--ok);font-size:24px;font-weight:900}@media(max-width:820px){.grid{grid-template-columns:1fr}.history{max-height:400px}.score{font-size:52px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">🎯 DARTSCORER</div><div class="muted">X01 · Touchscreen · Bot</div></div><button id="new">Neues Spiel</button></div><section id="setup" class="panel setup"><h2>Spiel einrichten</h2><div class="row"><div><label>Startpunktzahl</label><select id="start"><option>301</option><option selected>501</option><option>701</option></select></div><div><label>Spieler</label><select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><div><label>Bot-Stärke</label><select id="difficulty"><option value="easy">Einfach</option><option value="medium" selected>Mittel</option><option value="hard">Schwer</option></select></div></div><div id="names" class="row"></div><button class="primary" id="startBtn">Spiel starten</button><div class="muted">Bei 2 Spielern ist Spieler 2 automatisch ein Bot. Bei 3/4 Spielern wird ein Spieler mit dem Namen „Bot“ ebenfalls als Bot behandelt.</div></section><section id="game" class="grid hidden"><div class="panel"><div class="scoreline"><div><div id="turn" class="turn"></div><div id="stats" class="muted"></div></div><div id="score" class="score">501</div></div><h3 style="margin-top:20px">Aktuelle Aufnahme</h3><div class="muted">Gib die Summe der bis zu drei Darts ein.</div><div id="quick" class="quick"></div><div id="keypad" class="keypad"></div><div class="row" style="margin-top:10px"><button id="clear" class="danger">Löschen</button><button id="undo">Undo</button><button id="submit" class="primary">Aufnahme eintragen</button></div><div id="msg" class="muted" style="margin-top:10px"></div></div><div class="panel history"><h3>Spielverlauf</h3><div id="history"></div></div></section></div><script>
const $=x=>document.getElementById(x);let S=null,input='';const quick=[26,41,45,60,81,85,100,121,140,125,180,59];
function names(){let n=+$('count').value;$('names').innerHTML='';for(let i=0;i<n;i++){let d=document.createElement('div');d.innerHTML='<label>Spieler '+(i+1)+'</label><input id="p'+i+'" value="'+(i===0?'Spieler 1':i===1?'Bot':'Spieler '+(i+1))+'">';$('names').appendChild(d)}}$('count').onchange=names;names();
function bot(p){return p.bot||p.name.trim().toLowerCase()==='bot'}function start(){let n=+$('count').value;S={start:+$('start').value,current:0,round:1,finished:false,undo:[],players:[]};for(let i=0;i<n;i++)S.players.push({name:$('p'+i).value.trim()||'Spieler '+(i+1),score:S.start,bot:i===1&&n===2,turns:0,total:0,history:[]});$('setup').classList.add('hidden');$('game').classList.remove('hidden');render();setTimeout(botTurn,400)}$('startBtn').onclick=start;$('new').onclick=()=>{S=null;$('game').classList.add('hidden');$('setup').classList.remove('hidden');};
function render(){if(!S)return;let p=S.players[S.current];$('turn').textContent=p.name+(bot(p)?' · BOT':'')+' ist dran';$('score').textContent=p.score;$('stats').textContent='Ø Aufnahme: '+(p.turns?(p.total/p.turns).toFixed(1):'0.0')+' · Aufnahmen: '+p.turns;renderQuick();renderHistory();localStorage.setItem('dartscorer',JSON.stringify(S))}
function renderQuick(){$('quick').innerHTML='';quick.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{input=''+v;$('msg').textContent='Eingabe: '+input};$('quick').appendChild(b)})}
function split(v){if(v===0)return ['0','0','0'];if(v<=60)return [String(v),'0','0'];let a=Math.min(60,v),b=Math.min(60,v-a);return [String(a),String(b),String(v-a-b)]}
function renderHistory(){let h=$('history');h.innerHTML='';let max=Math.max(0,...S.players.map(p=>p.history.length));if(!max){h.innerHTML='<div class="muted">Noch keine Aufnahmen.</div>';return}for(let r=max-1;r>=0;r--){let x=document.createElement('div');x.className='round';x.innerHTML=S.players.map(p=>{let q=p.history[r];return q?'<div><span class="rname">'+p.name+'</span> · '+q.value+' → '+q.remaining+(q.bust?' · BUST':'')+'<div class="darts">'+q.darts.map(d=>'<span class="dart">'+d+'</span>').join('')+'</div></div>':''}).join('');h.appendChild(x)}}
function snap(){S.undo.push(JSON.stringify({...S,undo:[]}));if(S.undo.length>30)S.undo.shift()}
function submit(v,isBot=false){v=Math.max(0,Math.min(180,Math.floor(+v||0)));let p=S.players[S.current];snap();let bust=v>p.score||p.score-v===1;let rem=bust?p.score:p.score-v;p.turns++;if(!bust)p.total+=v;p.history.push({value:v,remaining:rem,bust,darts:split(v)});if(!bust)p.score=rem;if(p.score===0){S.finished=true;$('msg').innerHTML='<span class="winner">'+p.name+' gewinnt!</span>';render();return}S.current=(S.current+1)%S.players.length;if(S.current===0)S.round++;input='';$('msg').textContent=bust?'BUST – Punktzahl bleibt unverändert.':'';render();setTimeout(botTurn,450)}
function botTurn(){if(!S||S.finished)return;let p=S.players[S.current];if(!bot(p))return;let s=p.score,d=$('difficulty').value,lo=d==='easy'?20:d==='medium'?35:45,hi=d==='easy'?70:d==='medium'?100:120,v;if(s<=170&&d!=='easy'){v=s;if(v===1||v>170)v=Math.min(s-2,120)}else v=Math.floor(Math.random()*(Math.min(hi,s)-lo+1))+lo;if(v<0)v=0;if(v===s-1)v=Math.max(0,v-2);submit(v,true)}
$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,0,10,15,20,25,30].map(v=>'<button data-v="'+v+'">'+v+'</button>').join('');$('keypad').onclick=e=>{let b=e.target.closest('button');if(!b)return;let v=+b.dataset.v;input=String(Math.min(180,(+input||0)*10+v));$('msg').textContent='Eingabe: '+input};$('clear').onclick=()=>{input='';$('msg').textContent=''};$('submit').onclick=()=>{if(input!=='')submit(+input)};$('undo').onclick=()=>{if(!S||!S.undo.length)return;let old=JSON.parse(S.undo.pop());old.undo=S.undo;S=old;render()};
</script></body></html>
